services:
  - type: web
    name: secure-notes-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "gunicorn run:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: secure-notes-db
          property: connectionString
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: secure-notes-db
    databaseName: securenotesdb
    user: notesadmin
    plan: free
